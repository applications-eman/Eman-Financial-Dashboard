name: Database migrations

# Applies supabase/migrations/*.sql to your Supabase project automatically.
#  * push to main that touches supabase/migrations  -> shows what is pending, then applies it
#  * "Run workflow" button (Actions tab)             -> dry run by default; untick "dry run" to apply
# Every migration file is written to be re-runnable, so it is always safe to apply the whole folder.
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (only list what would be applied)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing secret SUPABASE_DB_PASSWORD"; exit 1; }
          test -n "$PROJECT_REF" || { echo "Missing variable SUPABASE_PROJECT_REF"; exit 1; }
      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Pending migrations (dry run)
        run: supabase db push --dry-run
      - name: Apply migrations
        if: github.event_name == 'push' || inputs.dry_run == false
        run: supabase db push
