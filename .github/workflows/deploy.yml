name: Deploy

# Runs on every push to main (after CI passes on the PR) or manually.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Workload Identity Federation (no long-lived GCP key stored in GitHub)

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
  SERVICE: eman-expenses
  REPO: eman

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix valtown
      - run: npm run typecheck
      - run: npm test

  valtown:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync backend to Val Town
        run: node valtown/scripts/sync.mjs
        env:
          VAL_TOWN_API_KEY: ${{ secrets.VAL_TOWN_API_KEY }}
          VAL: ${{ vars.VAL_TOWN_VAL || 'applications/eman-expense-api' }}

  cloud-run:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build image with Cloud Build
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${REPO}/${SERVICE}:${GITHUB_SHA::8}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud builds submit --tag "$IMAGE" --project "${{ vars.GCP_PROJECT_ID }}" .
      - name: Deploy to Cloud Run (min instances 0, secrets from Secret Manager)
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" --project "${{ vars.GCP_PROJECT_ID }}" --region "$REGION" \
            --platform managed --allow-unauthenticated \
            --min-instances 0 --max-instances 3 --memory 512Mi --port 8080 \
            --set-secrets "NEXT_PUBLIC_SUPABASE_URL=eman-supabase-url:latest,NEXT_PUBLIC_SUPABASE_ANON_KEY=eman-supabase-anon-key:latest,NEXT_PUBLIC_ADMIN_API_URL=eman-admin-api-url:latest"
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "${{ vars.GCP_PROJECT_ID }}" --region "$REGION" --format 'value(status.url)')
          curl -fsS "$URL/healthz"
